name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # lxn/walk (internal/app, cmd/configurator) is Windows-only; a
    # non-Windows runner cannot even compile internal/app.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: gofmt (repo-owned files only)
        # third_party/walk is a vendored, minimally-patched upstream
        # copy of github.com/lxn/walk (see docs/BUILDING.md) and is
        # intentionally left as upstream formatted it, except for the
        # one patched line in tooltip.go — do not gofmt-check it here.
        shell: bash
        run: |
          files=$(gofmt -l . | grep -v '^third_party/walk/' || true)
          if [ -n "$files" ]; then
            echo "gofmt found unformatted files:"
            echo "$files"
            exit 1
          fi

      - name: go test
        run: go test ./...

      - name: build (console)
        run: go build ./...

      - name: build (release, windowsgui)
        run: go build -ldflags="-H windowsgui -s -w" -o configurator.exe ./cmd/configurator

      - uses: actions/upload-artifact@v4
        with:
          name: configurator-exe
          path: configurator.exe
