name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # BravoBisConfigurator.App targets net8.0-windows/UseWindowsForms and
    # only builds on Windows.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: dotnet restore
        run: dotnet restore BravoBisConfigurator.sln

      - name: dotnet build
        run: dotnet build BravoBisConfigurator.sln -c Release --no-restore

      - name: dotnet test
        run: dotnet test BravoBisConfigurator.sln -c Release --no-build

      - name: publish (self-contained single-file)
        run: dotnet publish src/BravoBisConfigurator.App/BravoBisConfigurator.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: configurator-exe
          path: publish/BravoBisConfigurator.App.exe
